# strata-xtx: regels voor /etc/pve/lxc/<CTID>.conf op de Proxmox-host (container gestopt aanpassen).
# host-check.sh print deze regels met de juiste nummers voor jouw host.

# --- resources ----------------------------------------------------------------------------------------
cores: 16                 # alle fysieke cores die je kunt missen; de engine kiest zelf zijn pool-workers
memory: 98304             # 96 GiB: IQ3_S + 262K context + 8 GiB gesprekscache past ruim (~70 GiB gemeten op een XTX)
swap: 0                   # experts in swap = vastlopers

# --- GPU (Proxmox VE 8.1+: devN, werkt ook unprivileged) ----------------------------------------------
# gid=44 is "video" in Ubuntu/Debian-containers; bootstrap zet de service-gebruiker in die groep.
dev0: /dev/kfd,gid=44
dev1: /dev/dri/renderD128,gid=44
# (optioneel, alleen als je in de container ook /dev/dri/card* wilt zien, niet nodig voor ROCm)
# dev2: /dev/dri/card0,gid=44

# --- page-locked geheugen: de engine pint tientallen GB RAM voor de GPU ---------------------------------
lxc.prlimit.memlock: unlimited

# --- alternatief voor oudere Proxmox (< 8.1) of een privileged container: ------------------------------
# lxc.cgroup2.devices.allow: c 226:* rwm          # /dev/dri
# lxc.cgroup2.devices.allow: c <KFD_MAJOR>:* rwm  # /dev/kfd: major uit "ls -l /dev/kfd" op de host (vaak 234-511)
# lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir
# lxc.mount.entry: /dev/kfd dev/kfd none bind,optional,create=file
